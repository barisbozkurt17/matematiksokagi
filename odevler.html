<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Ödev Takip Sistemi | Matematik Sokağı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: 0.9; }

    .content { padding: 24px 20px; }

    /* GİRİŞ FORMU */
    .login-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 360px;
      margin: 0 auto;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12.5px; font-weight: 700; color: #475569; }
    .form-input, .form-select {
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus { border-color: #ea580c; }

    .btn-submit {
      background: #ea580c;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .btn-submit:hover { background: #c2410c; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    /* ÖDEV LİSTESİ EKRANI */
    .dashboard { display: none; }
    .student-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .student-info h2 { font-size: 16px; color: #0f172a; }
    .student-info span {
      display: inline-block;
      margin-top: 3px;
      font-size: 12px;
      font-weight: 700;
      background: #ffedd5;
      color: #c2410c;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .btn-logout {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-logout:hover { background: #cbd5e1; }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hw-list { display: flex; flex-direction: column; gap: 12px; }

    .hw-card {
      border: 1.5px solid #e2e8f0;
      border-left: 5px solid #ea580c;
      border-radius: 12px;
      padding: 14px 16px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.15s ease;
    }
    .hw-card.past-due {
      border-left-color: #94a3b8;
      background: #f8fafc;
      opacity: 0.75;
    }
    .hw-card.urgent {
      border-left-color: #dc2626;
      background: #fffafa;
    }

    .hw-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .due-date {
      font-size: 12.5px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-urgent { background: #fee2e2; color: #b91c1c; }
    .badge-past { background: #e2e8f0; color: #64748b; }

    .hw-text {
      font-size: 14px;
      line-height: 1.5;
      color: #1e293b;
      white-space: pre-wrap;
    }
    .hw-meta {
      margin-top: 8px;
      font-size: 11px;
      color: #94a3b8;
    }

    .empty-box {
      text-align: center;
      padding: 32px 16px;
      color: #64748b;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📚 Öğrenci Ödev Takip Sistemi</h1>
      <p>Öğrenci numaranızla giriş yaparak sınıfınıza ait ödevleri görüntüleyin</p>
    </div>

    <div class="content">
      <!-- 1. GİRİŞ BÖLÜMÜ -->
      <div class="login-box" id="loginView">
        <div class="form-group" id="classSelectGroup" style="display:none;">
          <label for="sinifSelect">Sınıfınız</label>
          <select id="sinifSelect" class="form-select">
            <option value="">Sınıf Seçin (İsteğe Bağlı)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="studentNoInput">Öğrenci Numaranız</label>
          <input type="text" id="studentNoInput" class="form-input" inputmode="numeric" placeholder="Örn: 145" onkeydown="if(event.key==='Enter') loginStudent()">
        </div>

        <button class="btn-submit" id="btnLogin" onclick="loginStudent()">Ödevlerimi Göster</button>
        <div class="error-msg" id="errorBox"></div>
      </div>

      <!-- 2. ÖDEV LİSTESİ BÖLÜMÜ -->
      <div class="dashboard" id="dashboardView">
        <div class="student-bar">
          <div class="student-info">
            <h2 id="studentNameTitle">Öğrenci Adı</h2>
            <span id="studentClassBadge">Sınıf: - | No: -</span>
          </div>
          <button class="btn-logout" onclick="logoutStudent()">🚪 Çıkış / Başka Numara</button>
        </div>

        <div class="section-title">
          <span>📋 Sınıf Ödev Listesi</span>
          <span id="hwTotalCount" style="color:#64748b; font-size:12px;">0 Ödev</span>
        </div>

        <div class="hw-list" id="homeworkList"></div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // BURAYA KENDİ APPS SCRIPT WEB APP URL'NİZİ (.../exec) YAPIŞTIRIN:
    // =========================================================================
    const SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbyE74xs-5gTl17v1ATvir7igmi5wniZm6ZJIJOBdrMu4b0VXbftGKoN0xP3SlI_ZxnO4w/exec";

    window.onload = function() {
      const saved = localStorage.getItem("ms_saved_student");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.no) {
            document.getElementById('studentNoInput').value = parsed.no;
            loginStudent(parsed.sinif || '');
          }
        } catch (e) {}
      }
    };

    async function loginStudent(forcedClass = null) {
      const noInput = document.getElementById('studentNoInput').value.trim();
      const sinifSelect = document.getElementById('sinifSelect');
      const selectedClass = forcedClass !== null ? forcedClass : sinifSelect.value;
      const errBox = document.getElementById('errorBox');
      const btn = document.getElementById('btnLogin');

      if (!noInput) {
        showError("Lütfen öğrenci numaranızı girin.");
        return;
      }

      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sorgulanıyor...';

      try {
        const url = `${SCRIPT_API_URL}?action=odevApi&no=${encodeURIComponent(noInput)}&sinif=${encodeURIComponent(selectedClass)}`;
        const response = await fetch(url);
        const data = await response.json();

        btn.disabled = false;
        btn.textContent = 'Ödevlerimi Göster';

        if (!data.success) {
          if (data.needClassSelect && Array.isArray(data.classes)) {
            const grp = document.getElementById('classSelectGroup');
            grp.style.display = 'flex';
            sinifSelect.innerHTML = '<option value="">Lütfen Sınıfınızı Seçin</option>';
            data.classes.forEach(c => {
              const opt = document.createElement('option');
              opt.value = c;
              opt.textContent = c;
              sinifSelect.appendChild(opt);
            });
          }
          showError(data.message || "Öğrenci bulunamadı.");
          return;
        }

        // Başarılı giriş: Bilgileri hatırla ve ekranı aç
        localStorage.setItem("ms_saved_student", JSON.stringify({
          no: data.student.no,
          sinif: data.student.sinifAdi
        }));

        renderDashboard(data.student, data.homeworks || []);

      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Ödevlerimi Göster';
        showError("Sunucuya bağlanılamadı. Lütfen internet bağlantınızı veya API adresini kontrol edin.");
      }
    }

    function showError(msg) {
      const errBox = document.getElementById('errorBox');
      errBox.textContent = msg;
      errBox.style.display = 'block';
    }

    function logoutStudent() {
      localStorage.removeItem("ms_saved_student");
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'flex';
      document.getElementById('studentNoInput').value = '';
      document.getElementById('classSelectGroup').style.display = 'none';
      document.getElementById('sinifSelect'). value = '';
      document.getElementById('studentNoInput').focus();
    }

    function parseTrDate(dateStr) {
      const parts = String(dateStr || '').trim().split('.');
      if (parts.length !== 3) return null;
      return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
    }

    function renderDashboard(student, homeworks) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      document.getElementById('studentNameTitle').textContent = `👋 Hoş geldin, ${student.adSoyad}`;
      document.getElementById('studentClassBadge').textContent = `Sınıf: ${student.sinifAdi}  |  Okul No: ${student.no}`;
      document.getElementById('hwTotalCount').textContent = `${homeworks.length} Ödev`;

      const listEl = document.getElementById('homeworkList');
      listEl.innerHTML = '';

      if (homeworks.length === 0) {
        listEl.innerHTML = `<div class="empty-box">🎉 Harika! <b>${student.sinifAdi}</b> sınıfı için şu anda kayıtlı ödev bulunmuyor.</div>`;
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      homeworks.forEach(hw => {
        const dueDate = parseTrDate(hw.sonTarih);
        let diffDays = null;
        if (dueDate) {
          diffDays = Math.round((dueDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
        }

        let cardClass = 'hw-card';
        let badgeClass = 'status-badge badge-active';
        let badgeText = '';

        if (diffDays === null) {
          badgeText = 'Teslim Tarihi: ' + hw.sonTarih;
        } else if (diffDays < 0) {
          cardClass += ' past-due';
          badgeClass = 'status-badge badge-past';
          badgeText = `Süresi Geçti (${Math.abs(diffDays)} gün önce)`;
        } else if (diffDays === 0) {
          cardClass += ' urgent';
          badgeClass = 'status-badge badge-urgent';
          badgeText = '⚠️ Son Gün Bugün!';
        } else if (diffDays === 1) {
          cardClass += ' urgent';
          badgeClass = 'status-badge badge-urgent';
          badgeText = '⏳ Yarına Teslim (1 Gün Kaldı)';
        } else {
          badgeText = `✅ ${diffDays} Gün Kaldı`;
        }

        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <div class="hw-top">
            <div class="due-date">📅 Son Teslim: <span>${escapeHtml(hw.sonTarih)}</span></div>
            <span class="${badgeClass}">${badgeText}</span>
          </div>
          <div class="hw-text">${escapeHtml(hw.odev)}</div>
          <div class="hw-meta">Eklenme: ${escapeHtml(hw.olusturmaTarihi || '-')}</div>
        `;
        listEl.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
