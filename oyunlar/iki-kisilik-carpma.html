<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İki Kişilik Çarpma Düellosu | Matematik Sokağı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        p1: {
                            light: '#eff6ff',
                            DEFAULT: '#2563eb',
                            dark: '#1d4ed8'
                        },
                        p2: {
                            light: '#fff1f2',
                            DEFAULT: '#e11d48',
                            dark: '#be123c'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-full flex flex-col select-none">

    <!-- Üst Bar -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 h-16 flex items-center justify-between shrink-0 sticky top-0 z-30">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Ana Sayfa</span>
            </a>
            <div class="h-4 w-px bg-slate-200"></div>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
                    <i data-lucide="swords" class="w-4 h-4"></i>
                </div>
                <h1 class="text-sm sm:text-base font-extrabold text-slate-900">İki Kişilik Çarpma Düellosu</h1>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="baslat()" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-amber-600 text-white text-xs font-extrabold flex items-center gap-1.5 shadow-sm transition-all active:scale-95 cursor-pointer">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>Yeniden Başlat</span>
            </button>
        </div>
    </header>

    <!-- Ana Oyun Alanı -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 flex flex-col justify-center">

        <!-- Ortak Soru ve Skor Paneli -->
        <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-sm border border-slate-200/90 mb-5 relative overflow-hidden">
            
            <div class="grid grid-cols-3 items-center gap-2 pb-5 border-b border-slate-100">
                <!-- 1. Oyuncu Skoru -->
                <div class="flex flex-col items-center sm:items-start">
                    <span class="text-[11px] font-black text-blue-600 uppercase tracking-wider">1. Oyuncu (Mavi)</span>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <i data-lucide="trophy" class="w-4 h-4 text-blue-500"></i>
                        <span id="skor1" class="text-2xl sm:text-3xl font-black text-blue-600">0</span>
                    </div>
                </div>

                <!-- Hedef / Mod Seçimi -->
                <div class="flex flex-col items-center">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Hedef Skor</span>
                    <select id="hedefSkor" onchange="baslat()" class="px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-extrabold text-slate-700 text-center focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="10" selected>İlk 10'a Ulaşan</option>
                        <option value="15">İlk 15'e Ulaşan</option>
                        <option value="20">İlk 20'ye Ulaşan</option>
                    </select>
                </div>

                <!-- 2. Oyuncu Skoru -->
                <div class="flex flex-col items-center sm:items-end">
                    <span class="text-[11px] font-black text-rose-600 uppercase tracking-wider">2. Oyuncu (Kırmızı)</span>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <i data-lucide="trophy" class="w-4 h-4 text-rose-500"></i>
                        <span id="skor2" class="text-2xl sm:text-3xl font-black text-rose-600">0</span>
                    </div>
                </div>
            </div>

            <!-- Ortak Gösterilen Soru -->
            <div class="py-6 sm:py-8 text-center relative">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest block mb-1">Doğru Cevaba İlk Basan Puanı Alır!</span>
                <div id="soru" class="text-4xl sm:text-6xl font-black text-slate-900 tracking-tight font-mono select-none">
                    ? &times; ?
                </div>
            </div>

        </div>

        <!-- İki Oyuncunun Karşılıklı Cevap Butonları -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
            
            <!-- 1. Oyuncu Arenası (Sol - Mavi) -->
            <div class="bg-blue-50/70 rounded-3xl p-5 sm:p-6 border-2 border-blue-200 flex flex-col justify-between">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-blue-600"></span>
                        <h3 class="font-black text-blue-900 text-sm sm:text-base">1. Oyuncu (Sol)</h3>
                    </div>
                    <span class="text-[11px] font-bold text-blue-600 bg-white px-2 py-0.5 rounded-lg border border-blue-200">A, B, C, D</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                    <button onclick="cevapVer(1, 0, this)" id="p1_0" class="btn-p1 py-4 sm:py-5 rounded-2xl bg-white border-2 border-blue-200 text-blue-900 text-xl sm:text-2xl font-black shadow-xs hover:border-blue-500 active:scale-95 transition-all cursor-pointer">-</button>
                    <button onclick="cevapVer(1, 1, this)" id="p1_1" class="btn-p1 py-4 sm:py-5 rounded-2xl bg-white border-2 border-blue-200 text-blue-900 text-xl sm:text-2xl font-black shadow-xs hover:border-blue-500 active:scale-95 transition-all cursor-pointer">-</button>
                    <button onclick="cevapVer(1, 2, this)" id="p1_2" class="btn-p1 py-4 sm:py-5 rounded-2xl bg-white border-2 border-blue-200 text-blue-900 text-xl sm:text-2xl font-black shadow-xs hover:border-blue-500 active:scale-95 transition-all cursor-pointer">-</button>
                    <button onclick="cevapVer(1, 3, this)" id="p1_3" class="btn-p1 py-4 sm:py-5 rounded-2xl bg-white border-2 border-blue-200 text-blue-900 text-xl sm:text-2xl font-black shadow-xs hover:border-blue-500 active:scale-95 transition-all cursor-pointer">-</button>
                </div>
            </div>

            <!-- 2. Oyuncu Arenası (Sağ - Kırmızı) -->
            <div class="bg-rose-50/70 rounded-3xl p-5 sm:p-6 border-2 border-rose-200 flex flex-col justify-between">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-rose-600"></span>
                        <h3 class="font-black text-rose-900 text-sm sm:text-base">2. Oyuncu (Sağ)</h3>
                    </div>
                    <span class="text-[11px] font-bold text-rose-600 bg-white px-2 py-0.5 rounded-lg border border-rose-200">1, 2, 3, 4</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
                    <button onclick="cevapVer(2, 0, this)" id="p2_0" class="btn-p2 py-4 sm:py-5 rounded-2xl bg-white border-2 border-rose-200 text-rose-900 text-xl sm:text-2xl font-black shadow-xs hover:border-rose-500 active:scale-95 transition-all cursor-pointer">-</button>
                    <button onclick="cevapVer(2, 1, this)" id="p2_1" class="btn-p2 py-4 sm:py-5 rounded-2xl bg-white border-2 border-rose-200 text-rose-900 text-xl sm:text-2xl font-black shadow-xs hover:border-rose-500 active:scale-95 transition-all cursor-pointer">-</button>
                    <button onclick="cevapVer(2, 2, this)" id="p2_2" class="btn-p2 py-4 sm:py-5 rounded-2xl bg-white border-2 border-rose-200 text-rose-900 text-xl sm:text-2xl font-black shadow-xs hover:border-rose-500 active:scale-95 transition-all cursor-pointer">-</button>
                    <button onclick="cevapVer(2, 3, this)" id="p2_3" class="btn-p2 py-4 sm:py-5 rounded-2xl bg-white border-2 border-rose-200 text-rose-900 text-xl sm:text-2xl font-black shadow-xs hover:border-rose-500 active:scale-95 transition-all cursor-pointer">-</button>
                </div>
            </div>

        </div>

    </main>

    <!-- Kazanan Modalı -->
    <div id="modalKazanan" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl relative animate-in fade-in zoom-in-95 duration-150">
            <div id="kazananIcon" class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 bg-emerald-100 text-emerald-600">
                <i data-lucide="trophy" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-black text-slate-900">Düello Tamamlandı!</h3>
            <p id="kazananMesaj" class="text-sm font-bold text-slate-600 mt-2 mb-6"></p>
            <button onclick="baslat()" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-extrabold text-sm transition-colors cursor-pointer shadow-md">
                Yeni Düello Başlat
            </button>
        </div>
    </div>

    <!-- Lucide İkonları Başlat -->
    <script>
        lucide.createIcons();

        let skor1 = 0;
        let skor2 = 0;
        let aktifSoru = { s1: 0, s2: 0, sonuc: 0 };
        let siklar = [];
        let oyunBitti = false;

        function rastgeleSayi(dogruCevap) {
            let arr = [dogruCevap];
            while (arr.length < 4) {
                let fark = Math.floor(Math.random() * 21) - 10;
                let r = dogruCevap + fark;
                if (r > 0 && !arr.includes(r)) {
                    arr.push(r);
                }
            }
            // Karıştır
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function yeniSoru() {
            let s1 = Math.floor(Math.random() * 9) + 2; // 2 - 10
            let s2 = Math.floor(Math.random() * 9) + 2; // 2 - 10
            let sonuc = s1 * s2;

            aktifSoru = { s1, s2, sonuc };
            document.getElementById("soru").innerHTML = `${s1} &times; ${s2}`;

            siklar = rastgeleSayi(sonuc);

            // Her iki oyuncunun butonlarına şıkları dağıt
            for (let i = 0; i < 4; i++) {
                document.getElementById(`p1_${i}`).textContent = siklar[i];
                document.getElementById(`p2_${i}`).textContent = siklar[i];
            }
        }

                let soruKilitli = false;

        function setAllButtonsDisabled(state) {
            for (let i = 0; i < 4; i++) {
                const b1 = document.getElementById(`p1_${i}`);
                const b2 = document.getElementById(`p2_${i}`);
                if (b1) b1.disabled = state;
                if (b2) b2.disabled = state;
            }
        }

        function cevapVer(oyuncu, secimIndex, buton) {
            if (oyunBitti || soruKilitli) return;

            const secilenDeger = siklar[secimIndex];
            const hedef = parseInt(document.getElementById("hedefSkor").value);

            if (secilenDeger === aktifSoru.sonuc) {
                // Doğru cevap verildiğinde iki tarafın butonları anında kilitlenir
                soruKilitli = true;
                setAllButtonsDisabled(true);

                if (oyuncu === 1) {
                    skor1++;
                    document.getElementById("skor1").textContent = skor1;
                    buton.classList.add("!bg-emerald-500", "!text-white", "!border-emerald-600");
                } else {
                    skor2++;
                    document.getElementById("skor2").textContent = skor2;
                    buton.classList.add("!bg-emerald-500", "!text-white", "!border-emerald-600");
                }

                // 1 saniye (1000 ms) bekleme süresi
                setTimeout(() => {
                    buton.classList.remove("!bg-emerald-500", "!text-white", "!border-emerald-600");
                    if (skor1 >= hedef || skor2 >= hedef) {
                        bitir();
                    } else {
                        yeniSoru();
                        setAllButtonsDisabled(false);
                        soruKilitli = false;
                    }
                }, 1000);

            } else {
                // Yanlış Cevap: -1 Puan (Geçici kilitleme sadece yanlış basan için)
                if (oyuncu === 1) {
                    skor1 = Math.max(0, skor1 - 1);
                    document.getElementById("skor1").textContent = skor1;
                } else {
                    skor2 = Math.max(0, skor2 - 1);
                    document.getElementById("skor2").textContent = skor2;
                }

                buton.classList.add("!bg-rose-500", "!text-white", "!border-rose-600");
                buton.disabled = true; // aynı butona ardışık basamasın
                setTimeout(() => {
                    buton.classList.remove("!bg-rose-500", "!text-white", "!border-rose-600");
                    if (!soruKilitli) buton.disabled = false;
                }, 400);
            }
        }

        function bitir() {
            oyunBitti = true;
            const mesaj = document.getElementById("kazananMesaj");
            const icon = document.getElementById("kazananIcon");

            if (skor1 > skor2) {
                mesaj.textContent = `Tebrikler! 1. Oyuncu (Mavi) ${skor1} - ${skor2} skoruyla düelloyu kazandı!`;
                icon.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 bg-blue-100 text-blue-600";
            } else {
                mesaj.textContent = `Tebrikler! 2. Oyuncu (Kırmızı) ${skor2} - ${skor1} skoruyla düelloyu kazandı!`;
                icon.className = "w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 bg-rose-100 text-rose-600";
            }

            document.getElementById("modalKazanan").classList.remove("hidden");
        }

        function baslat() {
            skor1 = 0;
            skor2 = 0;
            oyunBitti = false;
            soruKilitli = false;
            setAllButtonsDisabled(false);
            document.getElementById("skor1").textContent = "0";
            document.getElementById("skor2").textContent = "0";
            document.getElementById("modalKazanan").classList.add("hidden");
            yeniSoru();
        }

        window.onload = baslat;
    </script>
</body>
</html>
